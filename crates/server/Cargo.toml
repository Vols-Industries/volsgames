[package]
name = "volsgames"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "volsgames"
path = "src/main.rs"

[lib]
name = "volsgames"
path = "src/lib.rs"

[dependencies]
quinn = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
volsgames-control = { workspace = true }
volsgames-gateway = { workspace = true }
volsgames-proto = { workspace = true }
volsgames-room = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["connect"] }
bytes = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
ureq = { workspace = true }
web-transport-quinn = { workspace = true }

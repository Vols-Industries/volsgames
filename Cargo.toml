[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Vols-Industries/volsgames"
rust-version = "1.90"

[workspace.dependencies]
volsgames-proto = { path = "crates/proto" }
volsgames-room = { path = "crates/room" }
volsgames-gateway = { path = "crates/gateway" }
volsgames-control = { path = "crates/control" }
anyhow = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hdrhistogram = { version = "7", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "3", features = ["json"] }
web-transport-quinn = "0.13"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
inherits = "release"
